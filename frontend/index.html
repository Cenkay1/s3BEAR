<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>s3BEAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg:            #0B0F17;
        --surface:       #121821;
        --elevated:      #1A2230;
        --overlay:       #232C3A;
        --border:        #232C3A;
        --border-sub:    #1A2230;
        --primary:       #10B981;
        --primary-hover: #059669;
        --primary-bright:#34D399;
        --primary-glow:  rgba(16,185,129,0.12);
        --primary-shadow:rgba(16,185,129,0.28);
        --orange:        #F59E0B;
        --green:         #22C55E;
        --aqua:          #38BDF8;
        --blue:          #10B981;
        --red:           #EF4444;
        --text:          #E6EDF3;
        --text-muted:    #94A3B8;
        --text-faint:    #64748B;
      }

      *, *::before, *::after { box-sizing: border-box; }

      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      /* Subtle grid background on body */
      body {
        background-image:
          linear-gradient(rgba(16,185,129,0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(16,185,129,0.02) 1px, transparent 1px);
        background-size: 48px 48px;
        background-color: var(--bg);
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--overlay); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

      /* Page load fade-in */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes glowPulse {
        0%, 100% { box-shadow: 0 0 12px var(--primary-shadow); }
        50%       { box-shadow: 0 0 24px var(--primary-shadow), 0 0 48px rgba(16,185,129,0.1); }
      }

      .animate-fade-up {
        animation: fadeUp 0.4s ease both;
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease both;
      }

      /* Stagger helpers */
      .stagger-1 { animation-delay: 0.05s; }
      .stagger-2 { animation-delay: 0.10s; }
      .stagger-3 { animation-delay: 0.15s; }
      .stagger-4 { animation-delay: 0.20s; }
      .stagger-5 { animation-delay: 0.25s; }
      .stagger-6 { animation-delay: 0.30s; }

      /* Ant Design overrides */
      .ant-table-wrapper .ant-table {
        background: transparent !important;
        font-family: 'Inter', sans-serif;
      }
      .ant-table-wrapper .ant-table-thead > tr > th {
        background: transparent !important;
        color: var(--text-muted) !important;
        font-size: 11px !important;
        font-weight: 600 !important;
        letter-spacing: 0.07em !important;
        text-transform: uppercase !important;
        border-bottom: 1px solid var(--border) !important;
      }
      .ant-table-wrapper .ant-table-tbody > tr > td {
        border-bottom: 1px solid var(--border-sub) !important;
      }
      .ant-table-wrapper .ant-table-tbody > tr:hover > td {
        background: var(--primary-glow) !important;
      }
      .ant-menu-dark { background: transparent !important; }
      .ant-menu-dark .ant-menu-item-selected {
        background: var(--primary-glow) !important;
        border-left: 2px solid var(--primary) !important;
      }
      .ant-menu-dark .ant-menu-item-selected a,
      .ant-menu-dark .ant-menu-item-selected .anticon {
        color: var(--primary-bright) !important;
      }
      .ant-btn-primary {
        background: var(--primary) !important;
        border-color: var(--primary) !important;
        color: #fff !important;
        font-weight: 600 !important;
      }
      .ant-btn-primary:hover {
        background: var(--primary-hover) !important;
        border-color: var(--primary-hover) !important;
      }
      .ant-btn-primary.login-submit {
        background: #10B981 !important;
        border-color: #10B981 !important;
      }
      .ant-btn-primary.login-submit:hover {
        background: #059669 !important;
        border-color: #059669 !important;
      }
      .ant-btn-primary.settings-configure {
        background: transparent !important;
        border-color: rgba(16,185,129,0.45) !important;
        color: #34D399 !important;
      }
      .ant-btn-primary.settings-configure:hover {
        background: rgba(16,185,129,0.1) !important;
        border-color: #10B981 !important;
        color: #6EE7B7 !important;
      }
      .ant-tabs-ink-bar { background: var(--primary) !important; }
      .ant-tabs-tab-active .ant-tabs-tab-btn { color: var(--primary-bright) !important; }
      .ant-progress-bg { background: var(--primary) !important; }
      .ant-statistic-content { color: var(--text) !important; font-family: 'Fira Code', monospace !important; }
      .ant-statistic-title { color: var(--text-muted) !important; font-size: 11px !important; text-transform: uppercase; letter-spacing: 0.06em; }
      /* File size / monospace values */
      .mono { font-family: 'Fira Code', monospace !important; font-size: 12px; }

      /* Hide login hero panel on narrow screens */
      @media (max-width: 900px) {
        .login-hero { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
