name: Manual Docker Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example: 1.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-docker-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch, version, and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This workflow must be run from the main branch."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use SemVer format without a v prefix, for example: 1.1.0"
            exit 1
          fi

          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/$VERSION" || git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag $VERSION or v$VERSION already exists."
            exit 1
          fi

  build-and-push:
    name: Build ${{ matrix.component }} image
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            image: bearcomp/s3bear-backend
          - component: frontend
            context: ./frontend
            image: bearcomp/s3bear-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ inputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  promote-latest:
    name: Promote images to latest
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Update latest tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx imagetools create \
            --tag bearcomp/s3bear-backend:latest \
            "bearcomp/s3bear-backend:$VERSION"
          docker buildx imagetools create \
            --tag bearcomp/s3bear-frontend:latest \
            "bearcomp/s3bear-frontend:$VERSION"

  tag-release:
    name: Create Git tag
    needs: promote-latest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag released commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$VERSION" "$GITHUB_SHA" --message "Release $VERSION"
          git push origin "refs/tags/$VERSION"